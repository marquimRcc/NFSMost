# ==============================================================================
# Configurações do DXVK para Need for Speed: Most Wanted (2005)
# Coloque este arquivo na raiz do jogo (junto de speed.exe)
# ==============================================================================

# Otimizações para GPUs AMD Radeon (RADV / Mesa)
d3d9.lenientClear = True
d3d9.floatEmulation = strict
d3d9.customVendorId = 1002
d3d9.maxFrameLatency = 1
d3d9.seamlessCubes = False

# Otimizações de shader e cache
dxvk.enableStateCache = True
